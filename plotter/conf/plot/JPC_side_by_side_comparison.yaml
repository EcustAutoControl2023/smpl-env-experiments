# 数据文件配置
performance_filename: "evaluation.csv"
error_filename: "error_occurred.csv"

use_percentage: true
# 指标名称配置
metric_names:
  - "Performance (Last 20%)"
  # - "Total Errors"

performance_metric_name: "Performance (Last 20%)"
error_metric_name: "Total Errors"

# 分组模式配置
side_by_side: true

# 配置颜色映射
config_colors:
  "standard method": "#1f77b4" # 蓝色 - s0e0配置
  "with our method": "#ff7f0e" # 橙色 - s75e25配置

# 柱状图样式配置
bar_width: 0.35
show_values: true

# 图表标题和轴标签
title: ""
xlabel: ""
ylabel: ""
xlabel_rotation: 0

# 图表尺寸和范围
figsize: [6, 6]

# 渲染模式和保存路径
render_mode: "plot"
save_path: "experiments/JPC/figures"
save_name: "JPC_side_by_side_comparison_performance"
dpi: 300

# 是否显示图例
legend: false

# 是否显示网格
grid: true

# 图表边距调整
tight_layout: true
