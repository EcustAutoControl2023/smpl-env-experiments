# @package _global_.plot

# 侧并排柱状图配置模板
# 用颜色区分配置参数，相同算法的不同配置紧贴显示

# =============================================================================
# 基本配置
# =============================================================================

# 绘图类型（必需）
plot_type: bar_plot

# 分组模式（启用侧并排模式）
side_by_side: true

# =============================================================================
# 实验数据配置
# =============================================================================

# 实验目录列表（支持通配符）
experiment_dirs:
  # 第一个算法的两个配置
  - "path/to/algorithm1_config1_seed-*"
  - "path/to/algorithm1_config2_seed-*"

  # 第二个算法的两个配置
  - "path/to/algorithm2_config1_seed-*"
  - "path/to/algorithm2_config2_seed-*"

  # 第三个算法的两个配置
  - "path/to/algorithm3_config1_seed-*"
  - "path/to/algorithm3_config2_seed-*"

# 组标签（算法名 + 配置，用于解析）
# 格式："{算法名} ({配置名})"
group_labels:
  - "Algorithm1 (config1)"
  - "Algorithm1 (config2)"
  - "Algorithm2 (config1)"
  - "Algorithm2 (config2)"
  - "Algorithm3 (config1)"
  - "Algorithm3 (config2)"

# 数据文件配置
performance_filename: "evaluation.csv"     # 性能数据文件
error_filename: "error_occurred.csv"       # 错误数据文件

# =============================================================================
# 指标配置
# =============================================================================

# 指标名称（会创建对应数量的子图）
metric_names:
  - "Performance (Last 20%)"
  - "Total Errors"

# 指标显示名称（用于数据处理）
performance_metric_name: "Performance (Last 20%)"
error_metric_name: "Total Errors"

# =============================================================================
# 颜色和样式配置
# =============================================================================

# 配置颜色映射（用颜色区分不同配置）
config_colors:
  "config1": "#1f77b4"    # 蓝色 - 第一种配置
  "config2": "#ff7f0e"    # 橙色 - 第二种配置
  # 如果有更多配置，可以继续添加：
  # "config3": "#2ca02c"   # 绿色
  # "config4": "#d62728"   # 红色

# 柱状图样式
bar_width: 0.35           # 柱子宽度
show_values: true         # 是否显示数值标签

# =============================================================================
# 图表外观配置
# =============================================================================

# 标题和标签
title: "Algorithm Performance Comparison"
xlabel: "Algorithms"
ylabel: "Values"
xlabel_rotation: 0        # x轴标签旋转角度

# 图表尺寸 [宽度, 高度]
figsize: [16, 6]          # 适合侧并排显示

# 图例和网格
legend: true              # 显示图例
grid: true                # 显示网格

# =============================================================================
# 输出配置
# =============================================================================

# 渲染模式：png, pdf, svg, plot
render_mode: "png"

# 保存路径和文件名
save_path: "output/figures"
save_name: "algorithm_comparison"
dpi: 300                  # 图片分辨率

# 图表布局调整
tight_layout: true

# =============================================================================
# 高级配置（可选）
# =============================================================================

# Y轴范围（可选，自动计算时可注释掉）
# ylim: [0, 5000]

# 字体大小配置
font_size: 12
title_font_size: 16
label_font_size: 12
legend_font_size: 10

# =============================================================================
# 使用说明
# =============================================================================

# 1. 复制此模板文件并重命名
# 2. 修改 experiment_dirs 为您的实验路径
# 3. 修改 group_labels 为对应的算法和配置名称
# 4. 根据需要调整颜色、尺寸等配置
# 5. 运行命令：python run_bar_plot.py config=您的配置文件名

# 实际使用示例：
# experiment_dirs:
#   - "experiments/JPC/d3rlpy_logs/bear_*_s0e0_*"
#   - "experiments/JPC/d3rlpy_logs/bear_*_s75e25_*"
#   - "experiments/JPC/d3rlpy_logs/crr_*_s0e0_*"
#   - "experiments/JPC/d3rlpy_logs/crr_*_s75e25_*"
#
# group_labels:
#   - "BEAR+SAC (s0e0)"
#   - "BEAR+SAC (s75e25)"
#   - "CRR+SAC (s0e0)"
#   - "CRR+SAC (s75e25)"

# 输出效果：
# 左子图显示性能指标，右子图显示错误指标
# 每个算法有两个紧贴的柱子，用蓝色和橙色区分配置
# X轴只显示算法名称，保持简洁
