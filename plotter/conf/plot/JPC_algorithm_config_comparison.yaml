# @package _global_.plot

# 绘图类型
plot_type: bar_plot

# 实验目录配置 - 支持多个算法
experiment_dirs:
  # BEAR+SAC 算法组
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_bear_sacif_buffer_linears0e0k1_rate0l0_Linears0e0T1_seed-*"
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_bear_sacif_buffer_linears75e25k1_rate0l0_Linears0e0T1_seed-*"

  # CRR+SAC 算法组
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_crr_sacif_buffer_linears0e0k1_rate0l0_Linears0e0T1_seed-*"
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_crr_sacif_buffer_linears75e25k1_rate0l0_Linears0e0T1_seed-*"

  # CALQL+SAC 算法组
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_calql_sacif_buffer_linears0e0k1_rate0l0_Linears0e0T1_seed-*"
  - "experiments/JPC/d3rlpy_logs/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_JPC_calql_sacif_buffer_linears75e25k1_rate0l0_Linears0e0T1_seed-*"

# 组标签（算法名 + 配置）
group_labels:
  - "BEAR+SAC (s0e0)"
  - "BEAR+SAC (s75e25)"
  - "CRR+SAC (s0e0)"
  - "CRR+SAC (s75e25)"
  - "CALQL+SAC (s0e0)"
  - "CALQL+SAC (s75e25)"

# 数据文件配置
performance_filename: "evaluation.csv"
error_filename: "error_occurred.csv"

# 指标名称配置
metric_names:
  - "Performance (Last 20%)"
  - "Total Errors"

performance_metric_name: "Performance (Last 20%)"
error_metric_name: "Total Errors"

# 分组模式配置
side_by_side: true

# 配置颜色映射
config_colors:
  "s0e0": "#1f77b4" # 蓝色 - s0e0配置
  "s75e25": "#ff7f0e" # 橙色 - s75e25配置

# 柱状图样式配置
bar_width: 0.35
show_values: true
group_spacing: 1.0

# 图表标题和轴标签
title: "Algorithm Performance Comparison by Configuration"
xlabel: "Algorithms"
ylabel: "Values"
xlabel_rotation: 0

# 图表尺寸和范围
figsize: [16, 6]

# 渲染模式和保存路径
render_mode: "png"
save_path: "experiments/JPC/figures"
save_name: "JPC_algorithm_config_comparison"
dpi: 300

# 是否显示图例
legend: true

# 是否显示网格
grid: true

# 字体大小配置
font_size: 12
title_font_size: 16
label_font_size: 12
legend_font_size: 10

# 图表边距调整
tight_layout: true
