# @package _global_.plot

# 绘图类型
plot_type: rollout_evaluation

# 实验目录 (使用命令行覆盖: "plot.experiment_dir=path/to/experiment")
experiment_dir: ${data.base_dir}/experiment1

# 文件名
filenames:
  - rollout_return.csv
  - evaluation.csv

# 图表标题和轴标签
title: "Rollout vs Evaluation Performance"
xlabel: "Epoch"
ylabel: "Return"

# 图表范围
ylim: [-100, 5000]

# 显示数据范围区域
show_range: true

# 颜色和标签
colors:
  - blue
  - red

labels:
  - "Rollout"
  - "Evaluation"

# 渲染模式和保存路径
render_mode: ${output.render_mode}
save_path: ${output.save_path}
dpi: ${output.dpi}

# 是否显示图例
legend: true