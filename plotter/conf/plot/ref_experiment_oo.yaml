# @package _global_.plot

# 绘图类型
plot_type: experiment_oo

# 离线和在线实验目录列表
offline_experiment_dirs:
  - ${data.base_dir}/offline_experiment1
  - ${data.base_dir}/offline_experiment2
  - ${data.base_dir}/offline_experiment3

online_experiment_dirs:
  - ${data.base_dir}/online_experiment1
  - ${data.base_dir}/online_experiment2
  - ${data.base_dir}/online_experiment3

# 文件名
offline_filename: environment.csv
online_filename: evaluation.csv

# 图表标题和轴标签
title: "Offline+Online Experiment Comparison"
xlabel: "Epoch"
ylabel: "Evaluation Return"

# 图表范围
ylim: [-100, 5000]

# 数据处理
offline_data_points: 10  # 使用离线实验最后的10个数据点
x_range: 110  # 使用1-110的x轴范围

# 显示数据范围区域
show_range: true

# 颜色和标签
colors:
  - blue
  - red
  - green
  - orange
  - purple
  - brown

labels:
  - "Experiment 1"
  - "Experiment 2"
  - "Experiment 3"
  - "Experiment 4"
  - "Experiment 5"
  - "Experiment 6"

# 渲染模式和保存路径
render_mode: ${output.render_mode}
save_path: ${output.save_path}
dpi: ${output.dpi}

# 是否显示图例
legend: true