# @package _global_.plot

# 绘图类型
plot_type: experiment_comparison

# 实验目录列表
experiment_dirs:
  - "${data.base_dir}/SACIF_env-pensimenv_reward-dense_type-online_only_explorer-off_critic-norm-on_rate0_seed-*"
  - "${data.base_dir}/SACIF_env-pensimenv_reward-dense_type-online_only_explorer-off_critic-norm-on_rate30_seed-*"
  - "${data.base_dir}/SACIF_env-pensimenv_reward-dense_type-online_only_explorer-off_critic-norm-on_rate50_seed-*"

# 文件名
filename: evaluation.csv

# 图表标题和轴标签
title: "Expert or No Expert (Online Only)"
xlabel: "Epoch"
ylabel: "Evaluation Return"

# 图表范围
ylim: [-100, 5000]

# 显示数据范围区域
show_range: true

# 颜色和标签
colors:
  - blue
  - green
  - orange

labels:
  - "no expert"
  - "expert=0.3"
  - "expert=0.5"

# 基准线值 (可选)
baseline_value: 3224

# 离线值点 (可选)
offline_value: ${data.offline_value}
offline_marker: "*"
offline_marker_size: 10
offline_marker_color: "black"
offline_label: "offline(CQL)"

# 渲染模式和保存路径
render_mode: ${output.render_mode}
save_path: ${output.save_path}
dpi: ${output.dpi}

# 是否显示图例
legend: true
