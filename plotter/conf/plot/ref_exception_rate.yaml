# @package _global_.plot

# 绘图类型
plot_type: exception_rate

# 实验目录 (使用命令行覆盖: "plot.experiment_dir=path/to/experiment")
experiment_dir:
  - "${data.base_dir}/sacif_env-pensimenv_reward-dense_type-offline_guide_online_explorer-off_critic-norm-on_rate0_cql-sacifpd_seed-*"
  - "${data.base_dir}/SACIF_env-pensimenv_reward-dense_type-online_only_explorer-off_critic-norm-on_rate0_error_code_seed-*"

# 文件名
filenames:
  - error_occurred.csv

# 批量大小
batch_size: 100

# 图表标题和轴标签
title: "Exception Rate Analysis"
xlabel: "Index"
ylabel: "Value"

# 颜色和标签
colors:
  - blue
  - red

labels:
  - "Ours"
  - "online only"

# 渲染模式和保存路径
render_mode: ${output.render_mode}
save_path: ${output.save_path}
dpi: ${output.dpi}

# 是否显示图例
legend: true
