[project]
name = "collision-risk-patch"
version = "0.1.0"
description = "Gaussian-process based collision risk estimation utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
gpytorch = [
    "torch",
    "gpytorch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collision_risk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/collision_risk",
    "README.md",
    "pyproject.toml",
]
